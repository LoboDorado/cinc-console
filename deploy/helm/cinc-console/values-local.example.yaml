# Developer-local Helm overrides.
# Copy to values-local.yaml (gitignored) and adjust for your environment.

# Example: private registry pull secret in your namespace.
imagePullSecrets:
  - name: artifactory-token

# Example: local/dev runtime mode.
nodeEnv: "development"

# Example: point at your own directory for LDAP bind auth (see
# values-example.yaml for the full set of ldap.* options).
authMode: ldap
ldap:
  url: ldaps://dc1.example.com:636
  baseDn: dc=example,dc=com
  bindDn: cn=svc-cinc-console,ou=service-accounts,dc=example,dc=com
  bindPassword: "" # don't commit a real password here - use --set or existingSecret
